<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Happy 19th Birthday, Nanda</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#030a1f;--p:#2d7bff;--p2:#00d4ff;--t:#eaf2ff;--m:#8fa8d6;--card:rgba(255,255,255,.06);--bd:rgba(120,170,255,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden;min-height:100vh;background-image:radial-gradient(circle at 20% 0,#0a2a6e 0,transparent 45%),radial-gradient(circle at 90% 60%,#06306b 0,transparent 40%)}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;animation:bl 14s ease-in-out infinite alternate;pointer-events:none}
.b1{width:420px;height:420px;background:#1c5cff;top:-100px;left:-100px}.b2{width:360px;height:360px;background:#00c8ff;bottom:-80px;right:-60px;animation-delay:-6s}
@keyframes bl{to{transform:translate(80px,60px) scale(1.2)}}
#cv{position:fixed;inset:0;z-index:50;pointer-events:none}
nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(3,10,31,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.lg{font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.nl{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.nl a{color:var(--m);text-decoration:none;font-size:.85rem;padding:8px 14px;border-radius:99px;white-space:nowrap;cursor:pointer;transition:.3s}
.nl a:hover,.nl a.on{color:#fff;background:linear-gradient(90deg,#1f5fe0,#0aa6d6);box-shadow:0 0 18px rgba(45,123,255,.5)}
#au{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--m)}#au span{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{position:relative;z-index:2;padding-top:70px}.w{max-width:1100px;margin:auto;padding:0 18px}
.btn{font:inherit;font-weight:600;border:0;color:#fff;cursor:pointer;padding:13px 26px;border-radius:99px;background:linear-gradient(90deg,#2d7bff,#00bfff);box-shadow:0 8px 30px rgba(45,123,255,.45);transition:.3s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-3px) scale(1.03)}.btn.g{background:var(--card);box-shadow:none;border:1px solid var(--bd)}.btn.sm{padding:7px 14px;font-size:.78rem}.btn.x{background:rgba(255,70,90,.15);border:1px solid rgba(255,90,110,.4);box-shadow:none}
.hero{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:30px 18px}
.big{position:absolute;font-size:clamp(14rem,48vw,36rem);font-weight:800;color:transparent;-webkit-text-stroke:2px rgba(45,123,255,.3);animation:fl 7s ease-in-out infinite;z-index:-1;line-height:1}
@keyframes fl{50%{transform:translateY(-24px) rotate(2deg)}}
.chip{border:1px solid var(--bd);background:var(--card);padding:8px 18px;border-radius:99px;font-size:.8rem;letter-spacing:3px;color:var(--p2);animation:up 1s both}
h1{font-size:clamp(2.4rem,9vw,6.4rem);line-height:1.02;font-weight:800;margin:20px 0 8px;background:linear-gradient(100deg,#fff,#7ab4ff,#00d4ff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite,up 1s .2s both}
@keyframes sh{to{background-position:-300% 0}}@keyframes up{from{opacity:0;transform:translateY(40px)}}
.nm{font-size:clamp(1.2rem,4vw,2rem);font-weight:300;letter-spacing:6px;text-transform:uppercase;color:var(--m);animation:up 1s .4s both}.nm b{color:#fff;font-weight:700}
.cd{display:flex;gap:12px;margin:34px 0;flex-wrap:wrap;justify-content:center;animation:up 1s .6s both}
.cd div{width:80px;padding:14px 0;border-radius:18px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px)}.cd b{display:block;font-size:1.9rem}.cd small{color:var(--m);font-size:.65rem;letter-spacing:2px;text-transform:uppercase}
.today{font-size:1.4rem;font-weight:700;color:var(--p2);padding:18px 30px;border:1px solid var(--p2);border-radius:20px;box-shadow:0 0 40px rgba(0,212,255,.4)}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;animation:up 1s .8s both}
.sc{margin-top:36px;color:var(--m);font-size:.75rem;letter-spacing:3px;animation:bn 2s infinite}@keyframes bn{50%{transform:translateY(8px)}}
.st{font-size:clamp(1.6rem,5vw,2.8rem);font-weight:800;margin:70px 0 8px}.st em{font-style:normal;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--m);margin-bottom:26px}
.rv{opacity:0;transform:translateY(40px);transition:1s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.sl{position:relative;aspect-ratio:16/9;border-radius:28px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 30px 80px rgba(0,60,200,.4);background:#06163a}
@media(max-width:700px){.sl{aspect-ratio:4/5}.nl a{padding:8px 11px}}
.sd{position:absolute;inset:0;opacity:0;transition:opacity 1.1s}.sd.on{opacity:1}.sd img{width:100%;height:100%}.sd img{object-fit:contain;position:relative}.sd .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) brightness(.45)}
.av{width:132px;height:132px;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,#2d7bff,#00d4ff,#fff,#2d7bff);animation:spin 6s linear infinite,up 1s both;box-shadow:0 0 50px rgba(0,160,255,.55);margin-bottom:18px}.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 20%;border:4px solid var(--bg);animation:spin 6s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}
.sd.on img{animation:kb 7s ease-out both}@keyframes kb{from{transform:scale(1.15)}to{transform:scale(1)}}
.phd{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#0a2a7a,#0891d6,#0a2a7a);background-size:200% 200%;animation:gr 8s ease infinite;text-align:center;padding:20px}.phd b{font-size:clamp(1.6rem,5vw,3rem)}.phd span{color:#cfe6ff;font-size:.85rem}@keyframes gr{50%{background-position:100% 100%}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:50px 24px 24px;background:linear-gradient(transparent,rgba(2,8,28,.9));font-size:1.1rem;font-weight:600;transform:translateY(20px);opacity:0;transition:.8s .3s}.sd.on .cap{transform:none;opacity:1}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:rgba(3,10,31,.55);color:#fff;font-size:1.6rem;cursor:pointer;backdrop-filter:blur(8px);z-index:3;transition:.3s}.ar:hover{background:var(--p)}.l{left:14px}.r{right:14px}
.dots{position:absolute;bottom:14px;right:20px;display:flex;gap:7px;z-index:3}.dots i{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.35);cursor:pointer;transition:.4s}.dots i.on{width:28px;background:var(--p2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:26px;backdrop-filter:blur(12px);transition:.4s}.card:hover{transform:translateY(-5px);border-color:var(--p);box-shadow:0 20px 50px rgba(45,123,255,.25)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.stat{text-align:center}.stat b{font-size:2.6rem;display:block;background:linear-gradient(90deg,#fff,var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}.stat span{color:var(--m);font-size:.8rem;letter-spacing:2px;text-transform:uppercase}
.letter{font-size:1.05rem;line-height:1.9;color:#cfe0ff}.letter h3{font-size:1.6rem;color:#fff;margin-bottom:10px}
.pg{padding:40px 0 80px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.gr{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-top:24px}.gi{border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--bd)}.gi img{width:100%;aspect-ratio:1;object-fit:cover;display:block;transition:.6s}.gi:hover img{transform:scale(1.1)}.gi p{padding:10px 12px 0;font-size:.85rem}.gi .row{padding:0 12px 12px;margin-top:8px}
.tl{position:relative;margin-top:26px;padding-left:28px;border-left:2px solid var(--bd)}.tl .card{margin-bottom:18px;position:relative}.tl .card:before{content:'';position:absolute;left:-39px;top:30px;width:16px;height:16px;border-radius:50%;background:var(--p2);box-shadow:0 0 18px var(--p2)}.yr{color:var(--p2);font-size:.8rem;letter-spacing:3px}.card h4{font-size:1.15rem;margin:4px 0}.card p{color:var(--m);line-height:1.6}
.wl{display:grid;gap:14px;margin-top:24px}.by{color:var(--p2);font-weight:600;font-size:.85rem;margin-top:10px}
.pr{display:grid;gap:12px}.pr div{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd)}.pr span{color:var(--m)}.pr b{text-align:right}
footer{text-align:center;color:var(--m);padding:40px 18px 50px;font-size:.85rem;position:relative;z-index:2}
#modal{position:fixed;inset:0;z-index:100;background:rgba(2,6,20,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}#modal.on{display:flex}
.mb{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:#07173d;border:1px solid var(--bd);border-radius:24px;padding:26px;animation:up .4s both}.mb h3{margin-bottom:14px;font-size:1.4rem}
label{display:block;font-size:.8rem;color:var(--m);margin-bottom:12px}input,textarea{width:100%;margin-top:6px;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:#fff;font:inherit;outline:0}input:focus,textarea:focus{border-color:var(--p2)}
.err{color:#ff8a9a;font-size:.8rem;min-height:1em}.sw{margin-top:14px;font-size:.85rem;color:var(--m)}.sw a{color:var(--p2);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,100px);background:linear-gradient(90deg,#2d7bff,#00bfff);padding:12px 22px;border-radius:99px;z-index:200;transition:.5s;font-size:.9rem}#toast.on{transform:translate(-50%,0)}
.empty{color:var(--m);padding:30px;text-align:center;border:1px dashed var(--bd);border-radius:20px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><canvas id="cv"></canvas>
<nav><div class="lg">N·19</div><div class="nl"><a data-r="home" href="#/home">Home</a><a data-r="gallery" href="#/gallery">Gallery</a><a data-r="wishes" href="#/wishes">Wishes</a><a data-r="ach" href="#/ach">Achievements</a><a data-r="profile" href="#/profile">Profile</a></div><div id="au"></div></nav>
<main id="app"></main><footer>Made with 💙 for Nanda Alfitrah · 14 October 2026</footer>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mem={};const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v;toast('Storage is full or blocked, changes may not persist')}}};
const def={profile:{name:'Nanda Alfitrah',nick:'Nanda',bday:'2007-10-14',city:'',hobby:'',bio:'Nineteen and just getting started.'},photos:[],wishes:[{id:1,by:'Your friends',msg:'Happy 19th birthday, Nanda! May this year bring you bigger wins, better days and everything you are working for.'}],ach:[{id:1,title:'Welcome to 19',year:'2026',desc:'A brand new chapter begins today.'}]};
let D=LS.get('ba_data',def),U=LS.get('ba_sess',null);const save=()=>LS.set('ba_data',D);
const BASE=[];const AP=()=>[...BASE,...D.photos];

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
const bd=()=>(D.profile.bday||'2007-10-14'),age=()=>2026-(+bd().slice(0,4));
/* canvas */
const cv=$('#cv'),x=cv.getContext('2d');let P=[];const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<55;i++)P.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2+.5,v:Math.random()*.4+.1,a:Math.random()});
function boom(){const cs=['#2d7bff','#00d4ff','#fff','#7aa8ff','#c9e0ff'];for(let i=0;i<160;i++)P.push({c:1,x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*18,vy:Math.random()*-15-2,w:Math.random()*8+4,col:cs[i%5],l:1,rot:Math.random()*6})}
(function f(){x.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>{if(p.c){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.l-=.008;p.rot+=.2;x.save();x.globalAlpha=Math.max(p.l,0);x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore();return p.l>0}p.y-=p.v;if(p.y<-5)p.y=cv.height+5;x.beginPath();x.fillStyle='rgba(120,190,255,'+p.a*.7+')';x.arc(p.x,p.y,p.r,0,7);x.fill();return 1});requestAnimationFrame(f)})();
/* slider */
let si=0,st;function initSl(){clearInterval(st);si=0;if($('#sl'))st=setInterval(()=>show(si+1),5000)}
function show(i){const s=document.querySelectorAll('#sl .sd'),d=document.querySelectorAll('#sl .dots i');if(!s.length)return;si=(i+s.length)%s.length;s.forEach((e,j)=>e.classList.toggle('on',j==si));d.forEach((e,j)=>e.classList.toggle('on',j==si))}
function slider(){const ps=AP().length?AP():['Moments','Memories','Adventures','Next Level'].map(c=>({ph:1,cap:c}));return `<div class="sl" id="sl">${ps.map((p,i)=>`<div class="sd${i?'':' on'}">${p.ph?`<div class="phd"><b>${p.cap}</b><span>Your photo will appear here</span></div>`:`<div class="bg" style="background-image:url(${esc(p.src)})"></div><img src="${esc(p.src)}" alt=""><div class="cap">${esc(p.cap)}</div>`}</div>`).join('')}<button class="ar l" data-a="prev" aria-label="Previous">‹</button><button class="ar r" data-a="next" aria-label="Next">›</button><div class="dots">${ps.map((_,i)=>`<i class="${i?'':'on'}" data-a="go" data-i="${i}"></i>`).join('')}</div></div>`}
let tx=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(!e.target.closest('#sl'))return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)show(si+(d<0?1:-1))});
/* countdown */
let fired=0;function tick(){const el=$('#cd');if(!el)return;const b=bd(),T=new Date(2026,+b.slice(5,7)-1,+b.slice(8,10)),d=T-Date.now();if(d<=0){el.innerHTML='<div class="today">🎉 Today is the day. Happy Birthday!</div>';el.style.display='block';if(!fired){fired=1;setTimeout(boom,600)}return}const n=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60],l=['Days','Hours','Min','Sec'];el.innerHTML=n.map((v,i)=>`<div><b>${String(v).padStart(2,'0')}</b><small>${l[i]}</small></div>`).join('')}setInterval(tick,1000);
/* modal + forms */
const closeM=()=>$('#modal').classList.remove('on');
function form(title,fs,v,cb,ex=''){const m=$('#modal');m.innerHTML=`<div class="mb"><form id="f"><h3>${title}</h3>${fs.map(f=>`<label>${f.l}${f.t=='area'?`<textarea name="${f.k}" rows="4" ${f.r?'required':''}>${esc(v[f.k])}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t=='file'?'accept="image/*"':`value="${esc(v[f.k])}"`} ${f.r?'required':''}>`}</label>`).join('')}<p class="err" id="er"></p><div class="row"><button type="button" class="btn g" data-a="close">Cancel</button><button class="btn">Save</button></div>${ex}</form></div>`;m.classList.add('on');$('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o={};fs.forEach(f=>o[f.k]=fd.get(f.k));try{await cb(o);closeM()}catch(z){$('#er').textContent=z.message}}}
const shrink=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.onerror=()=>no(Error('Invalid image'));i.src=r.result};r.readAsDataURL(f)});
const H=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nanda:'+s));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}};
function auth(mode){const reg=mode=='reg';form(reg?'Create account':'Welcome back',[...(reg?[{k:'name',l:'Display name',r:1}]:[]),{k:'u',l:'Username',r:1},{k:'p',l:'Password',t:'password',r:1}],{},async o=>{const us=LS.get('ba_users',{}),u=o.u.trim().toLowerCase(),h=await H(o.p);if(reg){if(o.p.length<4)throw Error('Password needs at least 4 characters');if(us[u])throw Error('Username already taken');us[u]={name:o.name.trim(),h};LS.set('ba_users',us)}else if(!us[u]||us[u].h!==h)throw Error('Wrong username or password');U={u,name:us[u].name};LS.set('ba_sess',U);toast('Welcome, '+U.name+'!');paint(1)},`<p class="sw">${reg?'Already have an account?':'New here?'} <a data-a="auth" data-m="${reg?'login':'reg'}">${reg?'Login':'Create account'}</a></p>`)}
const need=fn=>U?fn():(toast('Please login first'),auth('login'));
const C={photos:{t:'Photo',f:[{k:'file',l:'Photo',t:'file'},{k:'cap',l:'Caption',r:1}]},wishes:{t:'Wish',f:[{k:'msg',l:'Your birthday wish',t:'area',r:1}]},ach:{t:'Achievement',f:[{k:'title',l:'Title',r:1},{k:'year',l:'Year'},{k:'desc',l:'Description',t:'area'}]}};
function crud(k,id){const c=C[k],it=id?D[k].find(z=>z.id==id):{};if(id&&k=='wishes'&&it.u!=U.u)return toast('You can only edit your own wish');form((id?'Edit ':'Add ')+c.t,c.f,it,async o=>{if(k=='photos'){if(o.file&&o.file.size)it.src=await shrink(o.file);else if(!id)throw Error('Please choose a photo');it.cap=o.cap}else Object.assign(it,o);if(!id){it.id=Date.now();if(k=='wishes'){it.u=U.u;it.by=U.name}D[k].unshift(it)}save();paint(1)})}
/* pages */
const ctl=(k,id,own=1)=>U&&own?`<div class="row"><button class="btn sm g" data-a="edit" data-k="${k}" data-id="${id}">Edit</button><button class="btn sm x" data-a="del" data-k="${k}" data-id="${id}">Delete</button></div>`:'';
const R={
home:()=>`<section class="hero"><div class="big">19</div><div class="chip">14 · 10 · 2026</div><h1>Happy ${age()}th<br>Birthday</h1><div class="nm"><b>${esc(D.profile.name)}</b></div><div class="cd" id="cd"></div><div class="acts"><button class="btn" data-a="boom">Celebrate 🎉</button><a class="btn g" href="#/wishes">Send a wish</a></div><div class="sc">SCROLL ↓</div></section>
<div class="w"><h2 class="st rv">Moments <em>worth keeping</em></h2><p class="sub rv">A little look back, and a lot to look forward to.</p><div class="rv">${slider()}</div>
<div class="grid" style="margin-top:50px"><div class="card stat rv"><b>${age()}</b><span>Years young</span></div><div class="card stat rv"><b>${AP().length}</b><span>Photos</span></div><div class="card stat rv"><b>${D.wishes.length}</b><span>Wishes</span></div><div class="card stat rv"><b>${D.ach.length}</b><span>Achievements</span></div></div>
<div class="card letter rv" style="margin-top:30px"><h3>A note for ${esc(D.profile.nick||D.profile.name)}</h3>Nineteen is not just a number. It is the year you stop waiting for the future and start building it. Keep the curiosity, keep the discipline, and keep the people who believe in you close. Whatever you are working towards, this year is yours to take. Happy birthday, and here's to the best chapter yet.</div>
<div class="grid" style="margin-top:30px"><a class="card rv" href="#/gallery" style="text-decoration:none;color:inherit"><h4>📸 Gallery</h4><p>Browse and manage photos.</p></a><a class="card rv" href="#/wishes" style="text-decoration:none;color:inherit"><h4>💌 Wishes</h4><p>Leave a birthday message.</p></a><a class="card rv" href="#/ach" style="text-decoration:none;color:inherit"><h4>🏆 Achievements</h4><p>The milestones so far.</p></a></div><div style="height:50px"></div></div>`,
gallery:()=>`<div class="w pg"><div class="top"><div><h2 class="st" style="margin-top:20px">The <em>Gallery</em></h2><p class="sub">Swipe through the highlights, then manage the full collection.</p></div><button class="btn" data-a="add" data-k="photos">+ Add photo</button></div>${slider()}<div class="gr">${AP().map(p=>`<div class="gi rv"><img src="${esc(p.src)}" alt=""><p>${esc(p.cap)}</p>${p.fixed?'':ctl('photos',p.id)}</div>`).join('')}</div></div>`,
wishes:()=>`<div class="w pg"><div class="top"><div><h2 class="st" style="margin-top:20px">Birthday <em>Wishes</em></h2><p class="sub">Leave a message for ${esc(D.profile.nick)}.</p></div><button class="btn" data-a="add" data-k="wishes">+ Write a wish</button></div><div class="wl">${D.wishes.map(w=>`<div class="card rv"><p style="color:#eaf2ff;font-size:1.05rem">“${esc(w.msg)}”</p><div class="by">— ${esc(w.by)}</div>${ctl('wishes',w.id,w.u&&w.u==U?.u)}</div>`).join('')}</div></div>`,
ach:()=>`<div class="w pg"><div class="top"><div><h2 class="st" style="margin-top:20px">The <em>Achievements</em></h2><p class="sub">Milestones along the way.</p></div><button class="btn" data-a="add" data-k="ach">+ Add achievement</button></div><div class="tl">${D.ach.map(a=>`<div class="card rv"><div class="yr">${esc(a.year)}</div><h4>${esc(a.title)}</h4><p>${esc(a.desc)}</p>${ctl('ach',a.id)}</div>`).join('')}</div>${D.ach.length?'':'<div class="empty">No achievements yet.</div>'}</div>`,
profile:()=>{const p=D.profile,rows=[['Full name',p.name],['Nickname',p.nick],['Birthday',bd()],['Age',age()],['City',p.city],['Hobbies',p.hobby]];return `<div class="w pg"><div class="top"><div><h2 class="st" style="margin-top:20px">Personal <em>Data</em></h2><p class="sub">${esc(p.bio)}</p></div><button class="btn" data-a="pedit">Edit profile</button></div><div class="card pr">${rows.map(r=>`<div><span>${r[0]}</span><b>${esc(r[1]||'-')}</b></div>`).join('')}</div>${U?`<p class="sub" style="margin-top:20px">Logged in as <b>${esc(U.name)}</b></p>`:'<div class="empty" style="margin-top:20px">Login or create an account to edit data.<div class="row" style="justify-content:center"><button class="btn sm" data-a="auth" data-m="login">Login</button><button class="btn sm g" data-a="auth" data-m="reg">Create account</button></div></div>'}</div>`}};
function obs(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll('.rv').forEach(e=>io.observe(e))}
function paint(keep){const y=scrollY,r=location.hash.slice(2)||'home',k=R[r]?r:'home';$('#app').innerHTML=R[k]();document.querySelectorAll('.nl a').forEach(a=>a.classList.toggle('on',a.dataset.r==k));$('#au').innerHTML=U?`<span>${esc(U.name)}</span><button class="btn sm g" data-a="out">Logout</button>`:`<button class="btn sm" data-a="auth" data-m="login">Login</button>`;scrollTo(0,keep?y:0);initSl();obs();tick()}
addEventListener('hashchange',()=>paint(0));
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,k=t.dataset.k;
if(a=='auth')auth(t.dataset.m);else if(a=='out'){U=null;LS.set('ba_sess',null);toast('Logged out');paint(1)}else if(a=='close')closeM();else if(a=='prev')show(si-1);else if(a=='next')show(si+1);else if(a=='go')show(+t.dataset.i);else if(a=='boom')boom();
else if(a=='add')need(()=>crud(k));else if(a=='edit')need(()=>crud(k,id));
else if(a=='del')need(()=>{if(k=='wishes'&&D.wishes.find(z=>z.id==id)?.u!=U.u)return toast('Only the author can delete this');if(confirm('Delete this item?')){D[k]=D[k].filter(z=>z.id!=id);save();paint(1)}});
else if(a=='pedit')need(()=>form('Edit profile',[{k:'name',l:'Full name',r:1},{k:'nick',l:'Nickname'},{k:'bday',l:'Birth date',t:'date',r:1},{k:'city',l:'City'},{k:'hobby',l:'Hobbies'},{k:'bio',l:'Short bio',t:'area'}],D.profile,o=>{Object.assign(D.profile,o);save();paint(1)}))});
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal')closeM()});
paint(0);
</script></body></html>
